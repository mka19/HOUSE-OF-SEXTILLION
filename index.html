<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>House of Sextillion — Maison</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0a06'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23c8a24c' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="House of Sextillion — a luxury maison of bags, belts and shoes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Loading veil -->
    <div id="loader" class="loader" aria-hidden="true">
      <div class="loader__mark">HOUSE OF SEXTILLION</div>
      <div class="loader__bar"><span id="loader-fill" class="loader__fill"></span></div>
    </div>

    <!-- Continuous exhibition: two environments on one horizontal track -->
    <div id="showroom">
      <!-- Environment 1 — the live 3D golden panorama -->
      <section class="env" id="env1" aria-label="Environment one — The Golden Panorama">
        <canvas id="scene"></canvas>
        <div class="grade" aria-hidden="true"></div>
        <footer class="chrome chrome--bottom">
          <div class="chrome__eyebrow">The Golden Panorama</div>
          <h1 class="chrome__title">A room made of light</h1>
          <p class="chrome__lede">Real-time atelier · drag left to enter the showroom</p>
        </footer>
      </section>

      <!-- Environment 2 — the atelier showroom (flat image) -->
      <section class="env" id="env2" aria-label="Environment two — The Atelier Showroom">
        <div class="env2__img" id="env2img"></div>
        <div class="env2__hotspots" id="env2hotspots" aria-hidden="true"></div>
        <footer class="chrome chrome--bottom">
          <div class="chrome__eyebrow">The Atelier</div>
          <h1 class="chrome__title">The Collection</h1>
          <p class="chrome__lede">Bags · Belts · Shoes — drag right to return</p>
        </footer>
      </section>

      <!-- dark connecting "void" you pass through between the two rooms -->
      <div id="voidoverlay" aria-hidden="true"></div>
      <!-- warm light-continuity overlay travelling with the boundary -->
      <div id="lightseam" aria-hidden="true"></div>
    </div>

    <!-- Persistent brand chrome (above both environments) -->
    <header class="chrome chrome--top">
      <div class="chrome__brand">HOUSE OF SEXTILLION</div>
      <nav class="chrome__nav">
        <a href="#" class="nav-link" data-product="Bags">Bags</a>
        <a href="#" class="nav-link is-active" data-product="Belts">Belts</a>
        <a href="#" class="nav-link" data-product="Shoes">Shoes</a>
        <a href="#" class="nav-link nav-link--muted">Maison</a>
      </nav>
    </header>

    <div id="tooltip" class="tooltip" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
